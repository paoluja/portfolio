<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pao Luja – Art Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Pao</h1>
    <p class="tagline">3D Artist</p>
    <nav>
      <a href="#art">Portfolio</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>

    <section id="art">
      <h2>Art</h2>
      <div class="portfolio-grid">

        <a class="art-card" href="my-game/">
          <img src="images/my-game.png" alt="Screenshot of My Game">
          <h3>My Game</h3>
          <p>A one-line description.</p>
        </a>

        <a class="art-card" href="https://www.artstation.com/paolab">
          <img src="images/artstation.png" alt="ArtStation">
          <h3>ArtStation</h3>
          <p>A one-line description.</p>
        </a>

      </div>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>3D Artist focused on 3D modeling.</p>
    </section>

   


<section id="contact" class="contact-section">

  <div class="contact-content">
    <h2>Get in touch</h2>

    <p class="contact-intro">
      Have a question or an interesting project in mind?
      Drop me a message.
    </p>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

      <div class="form-row">
        <input
          type="text"
          name="name"
          placeholder="Your name"
          aria-label="Your name"
          required
        >

        <input
          type="email"
          name="email"
          placeholder="Your email"
          aria-label="Your email"
          required
        >
      </div>

      <textarea
        name="message"
        placeholder="Your message..."
        aria-label="Your message"
        rows="4"
        required
      ></textarea>

      <input
        type="text"
        name="_gotcha"
        style="display:none"
        tabindex="-1"
        autocomplete="off"
      >

      <button type="submit">Send message ↗</button>

    </form>
  </div>

</section>


  </main>

  <footer>
    <p>pao© 2026</p>
  </footer>

</body>
</html>
